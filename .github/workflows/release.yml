name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.13
      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$PACKAGE_VERSION"
      - name: Run release checks
        run: make check
      - name: Smoke test wheel
        run: uv run --isolated --no-project --with "$(find dist -name '*.whl' -print -quit)" gh-folder-download --help
      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with "$(find dist -name '*.tar.gz' -print -quit)" gh-folder-download --help
      - name: Publish to PyPI
        run: uv publish
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: dist/*
