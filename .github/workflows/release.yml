name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.13
      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$PACKAGE_VERSION"
      - name: Run release checks
        run: make check security
      - name: Smoke test wheel
        run: uv run --isolated --no-project --with "$(find dist -name '*.whl' -print -quit)" gh-folder-download --help
      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with "$(find dist -name '*.tar.gz' -print -quit)" gh-folder-download --help
      - name: Publish to PyPI
        run: uv publish
      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: dist/*
